border-radius:9px;padding:12px;text-align:left;display:flex;justify-content:space-between}.stageRow{width:100%;border:0;border-bottom:1px solid #edf0f4;border-radius:0;background:white}.toolbar{display:flex;justify-content:space-between;margin-bottom:12px}.toolbar input{width:360px;border:1px solid #dbe2eb;border-radius:8px;padding:10px}.table{padding:0;overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #edf0f4;text-align:left;font-size:10px;vertical-align:top}.table th{font-size:9px;color:#8a97a9;text-transform:uppercase}.table td small{display:block;color:#8996a7;font-size:8px;margin-top:3px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tags span{background:#f2f5f9;padding:5px 7px;border-radius:6px}.status{font-size:8px;background:#eaf8f2;color:#26815f;padding:5px 7px;border-radius:12px}.action{border:0;border-radius:6px;padding:6px 8px;background:#edf3fc;color:#2d64c1;font-size:9px;margin-right:5px}.action.danger{background:#fff0f0;color:var(--danger)}.licenseGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.lic{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f4;padding:12px 0}.lic small,.lic b{display:block}.lic small{font-size:9px;color:var(--muted);margin-top:3px}.switch{border:1px solid #d8e0ea;background:#fff;border-radius:18px;padding:6px 10px;font-size:8px}.switch.on{background:#e8f8f1;color:var(--good);border-color:#bce5d4}.modalBack{position:fixed;inset:0;background:#071225aa;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:white;border-radius:14px;width:min(900px,100%);max-height:90vh;overflow:auto;padding:20px}.modalHead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:15px}.modalHead h2{margin:4px 0}.modalHead button{border:0;background:#f0f3f7;border-radius:7px;width:32px;height:32px;font-size:20px}.roleGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.roleGrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:15px;text-align:left}.roleGrid span{display:block;color:var(--muted);font-size:10px;margin-top:5px}.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.formGrid label{font-size:9px;color:#6f7f94}.formGrid input,.formGrid select{width:100%;margin-top:5px;border:1px solid #dbe2eb;border-radius:7px;padding:9px;font-size:11px;background:#fff}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.formActions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px}.formActions .primary{border:0}.cardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.recordCard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.cardTop{display:flex;justify-content:space-between;gap:10px}.recordCard h3{margin:0 0 4px;font-size:14px}.recordCard .cardTop span{font-size:9px;color:var(--muted)}.infoList{margin:14px 0;border-top:1px solid #edf0f4}.infoList div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f4;font-size:10px}.infoList b{color:#78869a}.infoList span{text-align:right;font-weight:600}.manufacturingGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.miniList{display:grid;gap:7px}.miniRow,.productionRow{border:1px solid #edf0f4;border-radius:9px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}.miniRow b,.miniRow small,.productionRow b,.productionRow span{display:block}.miniRow small,.productionRow span{font-size:9px;color:var(--muted);margin-top:3px}.miniRow>div:last-child,.consume{display:flex;align-items:center;gap:7px;font-size:9px}.productionRow{align-items:flex-start}.consume{flex-wrap:wrap;justify-content:flex-end}.panelHead small{font-size:9px;color:var(--muted)}@media(max-width:900px){.side{transform:translateX(-100%)}.main{margin-left:0;width:100%}.kpis{gr hich modules each customer can use.</p><div class="actions"><button class="primary" id="loginHero">Open Customer Login</button></div></section><div class="roles">${['Manufacturer','C&F / Administrator','Distributor','Wholesaler','Retailer','Field Sales Executive'].map(x=>`<div class="roleCard"><b>${x}</b><span>Role-based workspace</span></div>`).join('')}</div><div class="stages">${stages.map((s,i)=>`<div><b>${i+1}</b>${s[0]}</div>`).join('')}</div></div>`}function loginModal(){return `<div class="modalBack"><div class="modal"><div class="modalHead"><div><small>Customer access</small><h2>Choose role</h2></div><button id="closeLogin">×</button></div><div class="roleGrid">${roles.map(r=>`<button data-role="${r}"><b>${roleNames[r]}</b><span>Open workspace</span></button>`).join('')}</div></div></div>`}function app(){return `<div class="app"><aside class="side"><div class="brand"><div class="logo">DS</div><div><b>DistriSync</b><small>ERP Cloud</small></div></div><div class="workspace"><small>Workspace</small><b>Customer Company</b><span>${roleNames[role]}</span></div><nav>${stages.map((s,i)=>`<div class="stage">${i+1}. ${s[0]}</div>${s[1].map(m=>`<button class="nav ${page===m?'active':''}" data-page="${m}" ${role!=='platform_owner'&&!licenses[m]?'disabled':''}><span>${mods[m][0]}</span>${role!=='platform_owner'&&!licenses[m]?'<em>LOCKED</em>':''}</button>`).join('')}`).join('')}</nav><div class="sideBottom"><button id="signout">Sign out</button></div></aside><main class="main"><header class="head"><div><small>Stage ${mods[page][1]}</small><h1>${mods[page][0]}</h1></div><div class="online">● Local engine online</div></header><section class="content">${page==='dashboard'?dashboard():page==='users'&&role==='platform_owner'?licensing():modulePage()}</section></main>${formOpen?formModal():''}</div>`}function dashboard(){const stock=db.products.reduce((a,x)=>a+Number(x.warehouseStock||0),0),recv=db.orders.reduce((a,x)=>a+Number(x.balanceDue||0),0);return `<div class="welcome"><div><small>Operational overview</small><h2>${roleNames[role]} Command Center</h2><p>All values are calculated from the current records.</p></div></div><div class="kpis"><div class="kpi"><small>Customers</small><strong>${db.customers.length}</strong></div><div class="kpi"><small>Products / SKUs</small><strong>${db.products.length}</strong></div><div class="kpi"><small>Warehouse Units</small><strong>${stock.toLocaleString('en-IN')}</strong></div><div class="kpi"><small>Receivables</small><strong>₹${recv.toLocaleString('en-IN')}</strong></div></div><div class="dashgrid"><div class="panel"><div class="panelHead"><h3>Interconnected Business Flow</h3></div><div class="flow">${[['Customer / Retailer','customers'],['Product & SKU','products'],['Order','orders'],['Inventory / Dispatch','inventory'],['Collection / Ledger','finance']].map(x=>`<button data-page="${x[1]}">${x[0]} <span>→</span></button>`).join('')}</div></div><div class="panel"><div class="panelHead"><h3>8 Stages</h3></div>${stages.map((s,i)=>`<button class="stageRow" data-page="${s[1][0]}"><b>${i+1}</b><span>${s[0]}</span><span>${i===7?'Manufacturing':'Active'}</span></button>`).join('')}</div></div>`}function licensing(){return `<div class="welcome"><div><small>Platform Owner</small><h2>Module Licensing</h2><p>Customer module licensing; the Platform Owner always has access to every module.</p></div></div><div class="licenseGrid">${stages.map((s,i)=>`<div class="panel"><div class="panelHead"><h3>Stage ${i+1} · ${s[0]}</h3></div>${s[1].map(m=>`<div class="lic"><div><b>${mods[m][0]}</b><small>${m==='manufacturing'?'Raw material, finished product, BOM, production and consumption':'Operational module'}</small></div><button class="switch ${licenses[m]?'on':''}" data-license="${m}">${licenses[m]?'UNLOCKED':'LOCKED'}</button></div>`).join('')}</div>`).join('')}</div>`}function modulePage(){if(page==='manufacturing')return manufacturingPage();if(page==='field')return fieldSalesPage();if(page==='customers')return customersPage();const rows=(db[page]||[]).filter(r=>JSON.stringify(r).toLowerCase().includes(search.toLowerCase()));return `<div class="welcome"><div><small>Stage ${mods[page][1]}</small><h2>${mods[page][0]}</h2><p>${rows.length} records · Create, edit, delete and search.</p></div><button class="primary" id="newRecord">＋ New Record</button></div><div class="toolbar"><input id="search" value="${esc(search)}" placeholder="Search records..."><span>${roleNames[role]}</span></div><div class="panel table">${rows.length?`<table><thead><tr><th>Record</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name||r.product||r.orderNo||r.productionNo||r.reference||r.finishedProduct||r.id)}</b><small>${esc(r.id)}</small></td><td><div class="tags">${Object.entries(r).filter(([k])=>k!=='id'&&k!=='name'&&k!=='status').slice(0,5).map(([k,v])=>`<span><b>${esc(k)}</b>: ${esc(v)}</span>`).join('')}</div></td><td><span class="status">${esc(r.status||'Active')}</span></td><td><button class="action" data-edit="${r.id}">Edit</button><button class="action danger" data-delete="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div style="padding:45px;text-align:center;color:#8190a4">No records. Click New Record to create one.</div>'}</div>`}function customersPage(){const rows=db.customers||[];return '<div class="welcome"><div><small>Core ERP</small><h2>Customers & Retailers</h2><p>'+rows.length+' customer records</p></div><button class="primary" id="newRecord">＋ Add Customer / Retailer</button></div><div class="cardGrid">'+rows.map(r=>'<div class="recordCard"><div class="cardTop"><div><h3>'+esc(r.name)+'</h3><span>'+esc(r.type||'Retailer')+'</span></div><div><button class="action" data-edit="'+r.id+'">Edit</button><button class="action danger" data-delete="'+r.id+'">Delete</button></div></div><div class="infoList"><div><b>Owner Name</b><span>'+esc(r.ownerName||'—')+'</span></div><div><b>Contact Number</b><span>'+esc(r.contactNumber||'—')+'</span></div><div><b>Location</b><span>'+esc([r.city,r.state].filter(Boolean).join(', ')||'—')+'</span></div><div><b>Credit Limit</b><span>₹'+Number(r.creditLimit||0).toLocaleString('en-IN')+'</span></div><div><b>Outstanding</b><span>₹'+Number(r.outstanding||0).toLocaleString('en-IN')+'</span></div></div><span class="status">'+esc(r.status||'Active')+'</span></div>').join('')+'</div>'}
function fieldSalesPage(){const rows=(db.field||[]).filter(r=>r.role==='Sales Executive');return '<div class="welcome"><div><small>Distribution → Field Force</small><h2>Sales Executive Force Command</h2><p>Field Sales Executives working under distributors, with territory, attendance, DSR, collections and targets.</p></div><button class="primary" id="newRecord">＋ Add Field Sales Executive</button></div><div class="cardGrid">'+rows.map(r=>'<div class="recordCard"><div class="cardTop"><div><h3>'+esc(r.name)+'</h3><span>Field Sales Executive</span></div><div><button class="action" data-edit="'+r.id+'">Edit</button><button class="action danger" data-delete="'+r.id+'">Delete</button></div></div><div class="infoList"><div><b>Distributor</b><span>'+esc(r.distributor||'Unassigned')+'</span></div><div><b>Sales Area</b><span>'+esc(r.salesPointArea||r.assignedArea||'—')+'</span></div><div><b>Contact Number</b><span>'+esc(r.contactNumber||r.phone||'—')+'</span></div><div><b>Monthly Target</b><span>₹'+Number(r.monthlyTarget||r.salesTargetMonthly||0).toLocaleString('en-IN')+'</span></div><div><b>Salary</b><span>₹'+Number(r.salaryMonthly||0).toLocaleString('en-IN')+'</span></div><div><b>Attendance</b><span>'+esc((r.attendanceDaysPresent??'—')+' / '+(r.attendanceTotalDays??'—'))+'</span></div></div><span class="status">'+esc(r.status||'Active')+'</span></div>').join('')+'</div>'}
function manufacturingPage(){const rm=(db.manufacturing||[]).filter(r=>r.recordType==='Raw Material'),fg=(db.manufacturing||[]).filter(r=>r.recordType==='Finished Goods'),bom=(db.manufacturing||[]).filter(r=>r.recordType==='BOM'),po=(db.manufacturing||[]).filter(r=>r.recordType==='Production Order');return '<div class="welcome"><div><small>Stage 8</small><h2>Manufacturing</h2><p>Separate masters, BOM, and actual production consumption/output.</p></div></div><div class="manufacturingGrid"><div class="panel"><div class="panelHead"><h3>1. RAW MATERIALS</h3><button class="primary" data-manufacturing-type="Raw Material">＋ Add Raw Material</button></div><div class="miniList">'+rm.map(r=>'<div class="miniRow"><div><b>'+esc(r.name)+'</b><small>'+esc(r.code||'')+' · '+esc(r.uom||'')+'</small></div><div><span>Stock '+esc(r.currentStock??0)+'</span><button class="action" data-edit="'+r.id+'">Edit</button></div></div>').join('')+'</div></div><div class="panel"><div class="panelHead"><h3>2. FINISHED PRODUCTS</h3><button class="primary" data-manufacturing-type="Finished Goods">＋ Add Finished Product</button></div><div class="miniList">'+fg.map(r=>'<div class="miniRow"><div><b>'+esc(r.product||r.name)+'</b><small>SKU '+esc(r.sku||r.finishedSku||'')+' · Version '+esc(r.version||'1.0')+'</small></div><div><span>Stock '+esc(r.quantity??r.currentStock??0)+'</span><button class="action" data-edit="'+r.id+'">Edit</button></div></div>').join('')+'</div></div><div class="panel"><div class="panelHead"><div><h3>3. BOM / FORMULA</h3><small>Material requirement for a production output.</small></div><button class="primary" data-manufacturing-type="BOM">＋ Add BOM</button></div><div class="miniList">'+bom.map(r=>'<div class="miniRow"><div><b>'+esc(r.finishedProduct)+'</b><small>SKU '+esc(r.finishedSku||'')+' · Version '+esc(r.version||'')+'</small></div><div><span>'+esc(r.rawMaterial||'')+' '+esc(r.consumptionQty??0)+' '+esc(r.uom||'')+'</span><button class="action" data-edit="'+r.id+'">Edit</button></div></div>').join('')+'</div></div><div class="panel"><div class="panelHead"><div><h3>4. PRODUCTION / CONSUMPTION</h3><small>Actual material consumed and finished quantity produced.</small></div><button class="primary" data-manufacturing-type="Production Order">＋ New Production</button></div><div class="miniList">'+po.map(r=>'<div class="productionRow"><div><b>'+esc(r.productionNo||r.id)+'</b><span>'+esc(r.finishedProduct||'')+' · Planned '+esc(r.plannedQty??0)+'</span></div><div class="consume"><span>Consumed: '+esc(r.consumedMaterial||'')+' '+esc(r.consumedQty??0)+'</span><span>Output: '+esc(r.actualQty??r.yieldQty??r.plannedQty??0)+'</span><button class="action" data-edit="'+r.id+'">Edit</button></div></div>').join('')+'</div></div></div>'}
function formModal(){const fs=fields[page]||[];const r=editRow||{id:id(page.slice(0,3).toUpperCase())};return `<div class="modalBack"><div class="modal"><div class="modalHead"><div><small>${editRow?'Edit':'Create'} · ${mods[page][0]}</small><h2>${editRow?'Update':'New'} Record</h2></div><button id="closeForm">×</button></div><form id="recordForm"><div class="formGrid">${(page==='manufacturing'?manufacturingFields(editRow?.recordType||'Raw Material'):fs).map(k=>`<label>${k.replace(/([A-Z])/g,' $1')}<input name="${k}" value="${esc(r[k])}"></label>`).join('')}</div><div class="formActions"><button type="button" id="cancelForm">Cancel</button><button class="primary" type="submit">Save Record</button></div></form></div></div>`}function bind(){document.querySelectorAll('#loginTop,#loginHero').forEach(b=>b.onclick=()=>{document.body.insertAdjacentHTML('beforeend',loginModal());bindLogin()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{const m=b.dataset.page;if(!b.disabled){page=m;search='';render()}});const out=document.getElementById('signout');if(out)out.onclick=()=>{role=null;render()};const sr=document.getElementById('search');if(sr)sr.oninput=e=>{search=e.target.value;render();setTimeout(()=>{const n=document.getElementById('search');if(n){n.focus();n.selectionStart=n.selectionEnd=n.value.length}},0)};const nr=document.getElementById('newRecord');if(nr)nr.onclick=()=>{editRow=null;formOpen=true;render()};document.querySelectorAll('[data-manufacturing-type]').forEach(b=>b.onclick=()=>{editRow={recordType:b.dataset.manufacturingType};formOpen=true;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editRow=(db[page]||[]).find(x=>x.id===b.dataset.edit);formOpen=true;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this record?')){db[page]=db[page].filter(x=>x.id!==b.dataset.delete);persist();render()}});document.querySelectorAll('[data-license]').forEach(b=>b.onclick=()=>{if(role==='platform_owner'){licenses[b.dataset.license]=!licenses[b.dataset.license];persist();render()}});const rf=document.getElementById('recordForm');if(rf)rf.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(rf).entries());o.id=editRow?.id||rId(page);if(page==='manufacturing'&&editRow?.recordType)o.recordType=editRow.recordType;if(page==='orders'){o.subtotal=Number(o.quantity||0)*Number(o.unitPrice||0);o.total=Math.max(0,o.subtotal-Number(o.discount||0));o.balanceDue=Math.max(0,o.total-Number(o.cashCollected||0));if(!editRow){const p=db.products.find(x=>x.sku===o.sku||x.name===o.product);if(p){p.warehouseStock=Math.max(0,Number(p.warehouseStock||0)-Number(o.quantity||0));const inv=db.inventory.find(x=>x.product===p.name);if(inv){inv.balance=Math.max(0,Number(inv.balance||0)-Number(o.quantity||0));inv.issued=Number(inv.issued||0)+Number(o.quantity||0)}}}}if(page==='inventory')o.balance=Number(o.opening||0)+Number(o.received||0)-Number(o.issued||0)+Number(o.adjustment||0);if(page==='finance')o.balance=Math.max(0,Number(o.debit||0)-Number(o.credit||0));if(page==='manufacturing'&&o.recordType==='Production Order'&&!editRow){const rm=db.manufacturing.find(x=>x.recordType==='Raw Material'&&x.name===o.consumedMaterial);if(rm)rm.currentStock=Math.max(0,Number(rm.currentStock||0)-Number(o.consumedQty||0));const p=db.products.find(x=>x.sku===o.finishedSku||x.name===o.finishedProduct);if(p)p.warehouseStock=Number(p.warehouseStock||0)+Number(o.actualQty||o.plannedQty||0)}if(page==='manufacturing'&&o.recordType==='Finished Goods'&&!editRow){const p=db.products.find(x=>x.sku===o.sku||x.name===o.product);if(p)p.warehouseStock=Number(p.warehouseStock||0)+Number(o.quantity||0)}const a=db[page]||[];db[page]=editRow?.id?a.map(x=>x.id===editRow.id?o:x):[...a,o];persist();formOpen=false;editRow=null;render()};['closeForm','cancelForm'].forEach(x=>{const b=document.getElementById(x);if(b)b.onclick=()=>{formOpen=false;editRow=null;render()}})}function manufacturingFields(type){if(type==='Raw Material')return ['name','code','uom','openingStock','currentStock','reorderLevel','costPerUnit','status'];if(type==='Finished Goods')return ['product','sku','version','quantity','warehouse','unitCost','status'];if(type==='BOM')return ['finishedProduct','finishedSku','version','yieldQty','rawMaterial','consumptionQty','uom','status'];return ['productionNo','finishedProduct','finishedSku','version','plannedQty','consumedMaterial','consumedQty','actualQty','wastageQty','warehouse','startDate','endDate','status']}function rId(p){return id(p.slice(0,3).toUpperCase())}function bindLogin(){document.getElementById('closeLogin').onclick=()=>document.querySelector('.modalBack').remove();document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelector('.modalBack').remove();page='dashboard';render()})}render();
</script></body></html>
